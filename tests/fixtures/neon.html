
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>NEON</title>
<style>
  :root {
    --bg: #f4f4f8;   /* 与 Python 侧 BG_COLOR 同步（唯一主题色源） */
    --accent: #7c5cff;
    --accent2: #22d3ee;
    --accent3: #ff4d8d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }   /* 根元素底色：堵视口边缘 1px 缝隙 */
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: #232338;
    user-select: none;
  }
  @property --a {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  /* ===== 背景动态光斑（色相循环）===== */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    animation: float 18s ease-in-out infinite, hue 26s linear infinite;
  }
  .blob.b1 { width: 480px; height: 480px; background: #7c5cff; top: -120px; left: -100px; }
  .blob.b2 { width: 420px; height: 420px; background: #22d3ee; bottom: -160px; right: -80px; animation-delay: -6s, -9s; }
  .blob.b3 { width: 360px; height: 360px; background: #ff4d8d; top: 40%; left: 50%; animation-delay: -12s, -17s; }
  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(60px,-40px) scale(1.15); }
    66% { transform: translate(-40px,50px) scale(0.95); }
  }
  @keyframes hue { to { filter: blur(80px) hue-rotate(360deg); } }

  /* ===== 边缘暗角：盖住非客户区深带（窗口背景刷填充的环）=====
     原理：resize 环被窗口背景刷填充（visible 模式），亮色内容铺到客户区边缘时
     高对比读成"黑边"。把页面外圈 ~14px 用内阴影染成同色 → 视觉无缝。
     pointer-events: none，不影响任何交互。 */
  .vignette {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    box-shadow: inset 0 0 16px 8px rgba(244, 244, 248, 0.95);
  }

  /* ===== 网格（缓慢漂移）===== */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
    mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
    animation: grid-drift 50s linear infinite;
  }
  @keyframes grid-drift { to { background-position: 40px 40px, 40px 40px; } }

  /* ===== 自定义标题栏 ===== */
  .titlebar {
    position: relative; z-index: 10;
    height: 44px;
    display: flex; align-items: center;
    padding: 0 8px 0 0;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  /* 标题栏底部流动光线 */
  .titlebar::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, #7c5cff, #22d3ee, #ff4d8d, transparent);
    background-size: 200% 100%;
    opacity: 0.55;
    animation: line-flow 6s linear infinite;
    pointer-events: none;
  }
  @keyframes line-flow { to { background-position: -200% 0; } }


  /* ===== 顶部缩放热区（唯一保留的 JS 缩放入口；其余方向为原生隐形带）===== */
  .rz { position: fixed; z-index: 60; }
  .rz-t  { left: 0; right: 0; top: 0; height: 6px; cursor: ns-resize; }
  /* 顶部两角：NC 顶部带为 0，原生够不到 → 角部对角缩放由热区补齐。
     高度上限 6px：标题栏按钮顶缘约在 y=7px（44px 栏垂直居中），再高会吃掉按钮 */
  .rz-tl { left: 0; top: 0; width: 16px; height: 6px; cursor: nwse-resize; z-index: 61; }
  .rz-tr { right: 0; top: 0; width: 16px; height: 6px; cursor: nesw-resize; z-index: 61; }
  /* 最大化时禁用全部 JS 热区（最大化窗口的边缘拖拽交给系统原生行为） */
  .neon-max .rz { pointer-events: none; }

  /* 拖动区：只有这块区域能拖动窗口 */
  .drag-region {
    flex: 1;
    height: 100%;
    display: flex; align-items: center;
    padding-left: 8px;
    gap: 12px;
    cursor: move;
    -webkit-user-drag: none;
  }

  .logo {
    width: 20px; height: 20px; border-radius: 6px;
    background: conic-gradient(from 0deg, #7c5cff, #22d3ee, #ff4d8d, #7c5cff);
    animation: spin 5s linear infinite, logo-glow 2.4s ease-in-out infinite;
    flex-shrink: 0;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes logo-glow {
    0%, 100% { box-shadow: 0 0 10px rgba(124,92,255,0.6); }
    50%      { box-shadow: 0 0 22px rgba(34,211,238,0.9); }
  }
  .title {
    font-size: 13px; font-weight: 500; letter-spacing: 0.5px;
    color: rgba(35,35,56,0.85);
    pointer-events: none;
  }
  .title b {
    background: linear-gradient(90deg,#7c5cff,#22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }

  /* 窗口控制按钮 */
  .controls { display: flex; gap: 4px; padding-right: 8px; flex-shrink: 0; }
  .btn {
    width: 38px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: transparent;
    border: none;
    outline: none;
    color: rgba(35,35,56,0.75);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .btn:hover { background: rgba(0,0,0,0.06); color: #232338; }
  .btn:active { transform: scale(0.94); }
  .btn.close:hover { background: #e81123; color: #fff; }
  body.neon-suppress-hover .btn:hover,
  body.neon-suppress-hover .btn.close:hover {
    background: transparent;
    color: rgba(35,35,56,0.75);
  }
  .btn svg { width: 11px; height: 11px; }

  /* ===== 主内容 ===== */
  .content {
    position: relative; z-index: 5;
    height: calc(100% - 44px);
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .card {
    position: relative;
    width: 100%; max-width: 460px;
    padding: 40px 36px;
    border-radius: 22px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow:
      0 20px 60px -20px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.08);
    text-align: center;
  }
  /* 旋转霓虹描边 */
  .card::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 22px;
    padding: 1.3px;
    background: conic-gradient(from var(--a), #7c5cff, #22d3ee, #ff4d8d, #7c5cff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin-border 5s linear infinite;
    pointer-events: none;
  }
  @keyframes spin-border { to { --a: 360deg; } }
  /* 扫光 */
  .shine {
    position: absolute; top: -60%; left: -70%;
    width: 45%; height: 220%;
    transform: rotate(22deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    animation: sweep 4.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes sweep {
    0%   { left: -70%; }
    55%  { left: 130%; }
    100% { left: 130%; }
  }
  .card > :not(.shine) { position: relative; z-index: 1; }
  .badge {
    display: inline-block;
    padding: 5px 12px;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    border-radius: 999px;
    border: 1px solid rgba(124,92,255,0.45);
    color: #6d28d9;
    margin-bottom: 20px;
    background: linear-gradient(110deg,
      rgba(124,92,255,0.22) 30%, rgba(255,255,255,0.65) 50%, rgba(34,211,238,0.22) 70%);
    background-size: 220% 100%;
    animation: badge-shine 3.2s linear infinite;
  }
  @keyframes badge-shine { to { background-position: -220% 0; } }
  h1 {
    font-size: 32px; line-height: 1.15; font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #4c1d95 0%, #7c5cff 30%, #0e7490 60%, #db2777 85%, #4c1d95 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: grad-flow 8s ease-in-out infinite;
  }
  @keyframes grad-flow {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  p.sub {
    font-size: 14px; line-height: 1.6;
    color: rgba(35,35,56,0.55);
    margin-bottom: 28px;
  }
  .actions { display: flex; gap: 12px; justify-content: center; }
  .glow-btn {
    padding: 12px 26px; border-radius: 12px;
    border: 1px solid rgba(124,92,255,0.5);
    background: linear-gradient(135deg, #7c5cff, #5b3df0);
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(124,92,255,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    animation: btn-breathe 2.8s ease-in-out infinite;
    transition: transform 0.15s, box-shadow 0.3s;
  }
  @keyframes btn-breathe {
    0%, 100% { box-shadow: 0 0 18px rgba(124,92,255,0.35), inset 0 1px 0 rgba(255,255,255,0.2); }
    50%      { box-shadow: 0 0 34px rgba(34,211,238,0.5),  inset 0 1px 0 rgba(255,255,255,0.2); }
  }
  .glow-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 32px rgba(124,92,255,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .glow-btn:active { transform: translateY(0) scale(0.98); }
  .ghost-btn {
    padding: 12px 24px; border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.1);
    background: rgba(0,0,0,0.04);
    color: rgba(35,35,56,0.85); font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .ghost-btn:hover {
    background: rgba(0,0,0,0.08);
    border-color: rgba(0,0,0,0.18);
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(34,211,238,0.25);
  }

  .status {
    margin-top: 24px;
    font-size: 12px;
    color: rgba(35,35,56,0.4);
    font-family: 'Consolas', monospace;
    min-height: 16px;
    transition: color 0.3s;
  }
  .status.on { color: #0e7490; }
  /* 打字光标 */
  .status::after {
    content: '▌';
    margin-left: 2px;
    animation: caret 1.1s steps(1) infinite;
    opacity: 0.6;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* 系统"减少动态效果"偏好：关闭全部持续动画（可及性与省电） */
  @media (prefers-reduced-motion: reduce) {
    .blob, .grid, .shine, .card::before, .glow-btn, .logo,
    .titlebar::after, h1, .badge { animation: none !important; }
  }

</style>
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="grid"></div>

  <header class="titlebar">
    <!-- 拖动区：只有这块区域能拖动窗口 -->
    <div class="drag-region" id="dragRegion">
      <div class="logo"></div>
      <div class="title"><b>NEON</b> · 自定义标题栏演示</div>
    </div>
    <!-- 控制按钮：在拖动区外，正常点击 -->
    <div class="controls">
      <button class="btn" id="btn-min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12"><rect x="2" y="6" width="8" height="1.2" fill="currentColor"/></svg>
      </button>
      <button class="btn" id="btn-max" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="btn close" id="btn-close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="vignette"></div>

  <!-- 顶部热区：顶部 NC 条带已归零（防 DWM 原生按钮），顶边缩放只能由 JS 负责；
       左/右/下/角四方向走原生窗外隐形带 -->
  <div class="rz rz-t" data-dir="t" title="拖拽调整高度"></div>
  <div class="rz rz-tl" data-dir="tl" title="拖拽调整左上角"></div>
  <div class="rz rz-tr" data-dir="tr" title="拖拽调整右上角"></div>

  <main class="content">
    <div class="card">
      <i class="shine"></i>
      <div class="badge">pywebview · frameless</div>
      <h1>自定义标题栏<br>炫酷窗口</h1>
      <p class="sub">拖动标题栏移动窗口，窗沿与顶部热区调整大小。<br>所有交互都通过 JS ↔ Python API 桥接实现。</p>
      <div class="actions">
        <button class="glow-btn" id="pulse">脉冲</button>
        <button class="ghost-btn" id="quit">退出</button>
      </div>
      <div class="status" id="status">ready.</div>
      <div style="margin-top: 18px; display: flex; gap: 16px; justify-content: center; align-items: center; font-size: 12px;">
        <select aria-label="弹层定位验证">
          <option>弹层定位验证</option>
          <option>拖动窗口后再次打开</option>
        </select>
        <a href="https://github.com/RonTang/pyminiwebview" target="_blank" rel="noreferrer">系统浏览器验证</a>
      </div>
    </div>
  </main>

<script>
  const statusEl = document.getElementById('status');
  function log(msg) {
    statusEl.textContent = msg;
    statusEl.classList.add('on');
    clearTimeout(log._t);
    log._t = setTimeout(() => statusEl.classList.remove('on'), 1600);
  }

  function api() {
    if (!window.pywebview || !window.pywebview.api) {
      log('python bridge 未就绪');
      return null;
    }
    return window.pywebview.api;
  }

  const maxBtn = document.getElementById('btn-max');
  const ICON_MAX  = '<svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
  const ICON_REST = '<svg viewBox="0 0 12 12"><rect x="2" y="4" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M4 4V2h6v6H8" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>';
  // 导出 window：evaluate_js 在全局环境执行；typeof 检查 + window 双保险，
  // 防止事件早于脚本执行时把按钮内容写成字面量 "undefined"
  window.ICON_MAX = ICON_MAX;
  window.ICON_REST = ICON_REST;

  function suppressControlHover() {
    document.body.classList.add('neon-suppress-hover');
  }
  window.__neonSuppressControlHover = suppressControlHover;
  let lastControlPointer = null;
  const restoreControlHover = (e) => {
    const x = Math.floor(e.clientX), y = Math.floor(e.clientY);
    const repeated = lastControlPointer && lastControlPointer.x === x && lastControlPointer.y === y;
    lastControlPointer = { x, y };
    const inside = x >= 0 && y >= 0 && x < window.innerWidth && y < window.innerHeight;
    // 最小化还原时 Chromium 可能按旧坐标补发移动；窗外或重复坐标都不解除抑制。
    if (!inside || (repeated && document.body.classList.contains('neon-suppress-hover'))) return;
    document.body.classList.remove('neon-suppress-hover');
  };
  window.addEventListener('pointermove', restoreControlHover, true);
  window.addEventListener('mousemove', restoreControlHover, true);

  document.querySelectorAll('.btn').forEach((btn) => {
    btn.addEventListener('click', () => btn.blur());
  });
  document.getElementById('btn-min').addEventListener('click', () => {
    suppressControlHover();
    const a = api(); if (a) a.minimize();
  });
  document.getElementById('btn-close').addEventListener('click', () => {
    const a = api(); if (a) a.close();
  });
  document.getElementById('quit').addEventListener('click', () => {
    const a = api(); if (a) a.close();
  });

  function toggleMax() {
    const a = api(); if (!a) return;
    a.toggle_maximize().then(v => {
      maxBtn.innerHTML = v ? ICON_REST : ICON_MAX;
      document.body.classList.toggle('neon-max', v);
      log(v ? 'maximized' : 'restored');
    }).catch(err => log('max error: ' + err));
  }
  maxBtn.addEventListener('click', toggleMax);

  const dragRegion = document.getElementById('dragRegion');
  dragRegion.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const a = api(); if (!a) return;
    a.start_move().then(ok => {
      if (!ok) log('move unavailable');
    }).catch(err => log('move start error: ' + err));
  });

  // 脉冲特效：全屏闪光 + 卡片弹跳
  document.getElementById('pulse').addEventListener('click', () => {
    document.body.animate(
      [
        { filter: 'brightness(1)' },
        { filter: 'brightness(1.6) saturate(1.4)' },
        { filter: 'brightness(1)' }
      ],
      { duration: 500, easing: 'ease-out' }
    );
    document.querySelector('.card').animate(
      [
        { transform: 'scale(1)' },
        { transform: 'scale(1.03)' },
        { transform: 'scale(1)' }
      ],
      { duration: 450, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' }
    );
    log('pulse ✦');
  });

  // 顶部热区只负责触发系统缩放；后续位移、最小尺寸和取消均由 Windows 处理。
  document.querySelectorAll('.rz').forEach((zone) => {
    zone.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const a = api(); if (!a) return;
      a.start_resize(zone.dataset.dir).then(ok => {
        if (!ok) log('resize unavailable');
      }).catch(err => log('resize start error: ' + err));
    });
  });

  window.addEventListener('pywebviewready', () => log('bridge connected ✓'));

</script>
</body>
</html>
