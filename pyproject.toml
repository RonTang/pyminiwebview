[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyminiwebview"
version = "0.1.12"
description = "Minimal stable-ABI Python bindings for native Windows WebView2"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "licenses/*.txt",
]
authors = [{name = "Ron Tang"}]
keywords = ["webview2", "windows", "gui", "stable-abi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RonTang/pyminiwebview"
Source = "https://github.com/RonTang/pyminiwebview"

[tool.setuptools]
packages = ["pyminiwebview_win32", "pyminiwebview_helpers"]
package-dir = {"" = "src"}
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
