name: Build and publish wheels

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendor patch reproduces vendored engine
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(mktemp -d)"
          replica="$(mktemp -d)"
          expected="$(mktemp -d)"
          trap 'rm -rf "$upstream" "$replica" "$expected"' EXIT
          git init -q "$upstream"
          git -C "$upstream" config core.autocrlf false
          git -C "$upstream" remote add origin https://github.com/webview/webview.git
          git -C "$upstream" fetch -q --depth=1 origin 3ab4b5d722438fc8a13e6ca830c5e2372d19a01d
          git -C "$upstream" checkout -q FETCH_HEAD
          mkdir -p "$replica/vendor/webview"
          cp "$upstream/core/include/webview.h" "$replica/vendor/webview.h"
          cp "$upstream/core/include/webview/webview.h" "$replica/vendor/webview/webview.h"
          git show HEAD:patches/0001-pyminiwebview-engine-extensions.patch > "$expected/engine.patch"
          git -c core.autocrlf=false -C "$replica" apply --check "$expected/engine.patch"
          git -c core.autocrlf=false -C "$replica" apply "$expected/engine.patch"
          git show HEAD:vendor/webview.h > "$expected/webview.h"
          git show HEAD:vendor/webview/webview.h > "$expected/webview-engine.h"
          cmp "$replica/vendor/webview.h" "$expected/webview.h"
          cmp "$replica/vendor/webview/webview.h" "$expected/webview-engine.h"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Check release tag matches project version
        if: github.event_name == 'release'
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$'
          if (-not $match) { throw 'Project version is missing from pyproject.toml' }
          $version = $match.Matches.Groups[1].Value
          $tag = ${env:GITHUB_REF_NAME} -replace '^v', ''
          if ($version -cne $tag) { throw "Release tag ${env:GITHUB_REF_NAME} does not match project version $version" }
      - name: Check undefined names
        run: |
          python -m pip install ruff
          python -m ruff check --select F821 src
      - name: Build abi3 wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp39-win_amd64
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python {project}/tools/test_installed_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyminiwebview-wheel
          path: wheelhouse/*.whl

  abi3-compat:
    needs: build-wheel
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyminiwebview-wheel
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install abi3 wheel
        run: python -m pip install --no-deps (Get-ChildItem wheelhouse\*.whl).FullName
      - name: Verify installed helpers outside repository
        run: |
          $checkDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid().ToString()))
          Push-Location $checkDir
          try {
            python -c "from pyminiwebview_helpers import AsyncBridge, Bridge, call_js; from pyminiwebview_win32 import FramelessWindow, TrayIcon, open_file_dialog, save_file_dialog; print('wheel helpers OK')"
          } finally {
            Pop-Location
          }
      - name: Verify real WebView2 lifecycle
        run: >-
          python -c "import importlib.metadata, os, pyminiwebview; assert pyminiwebview.__version__ == importlib.metadata.version('pyminiwebview'); view = pyminiwebview.WebView(user_data_folder=os.path.abspath('.webview-abi3-test')); view.configure_app_mode(); view.notify_parent_position(); view.close(); print(pyminiwebview.__version__)"

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheel, abi3-compat]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyminiwebview-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
