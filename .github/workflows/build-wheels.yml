name: Build and publish wheels

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Build abi3 wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp39-win_amd64
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python {project}/tools/test_installed_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyminiwebview-wheel
          path: wheelhouse/*.whl

  abi3-compat:
    needs: build-wheel
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyminiwebview-wheel
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install abi3 wheel
        run: python -m pip install --no-deps (Get-ChildItem wheelhouse\*.whl).FullName
      - name: Verify installed helpers outside repository
        run: |
          $checkDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid().ToString()))
          Push-Location $checkDir
          try {
            python -c "from pyminiwebview_helpers import AsyncBridge, Bridge, call_js; from pyminiwebview_win32 import FramelessWindow, TrayIcon, open_file_dialog, save_file_dialog; print('wheel helpers OK')"
          } finally {
            Pop-Location
          }
      - name: Verify real WebView2 lifecycle
        run: >-
          python -c "import os, pyminiwebview; assert pyminiwebview.__version__ == '0.1.6'; view = pyminiwebview.WebView(user_data_folder=os.path.abspath('.webview-abi3-test')); view.configure_app_mode(); view.notify_parent_position(); view.close(); print(pyminiwebview.__version__)"

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheel, abi3-compat]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyminiwebview-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
